<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل الخبر…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#8b1e3f;
    --burgundy-dark:#6a1530;
    --burgundy-light:#b54a6a;
    --rose:#f4c2c9;
    --rose-soft:#fce8eb;
    --cream:#faf5ee;
    --cream-warm:#f5ebd9;
    --gold:#c9962e;
    --gold-light:#e0b955;
    --navy:#1f2937;
    --slate:#475569;
    --muted:#7a8597;
    --line:#ead7c8;
    --white:#ffffff;
    --shadow-sm:0 2px 8px rgba(31,41,55,.06);
    --shadow-md:0 8px 28px rgba(139,30,63,.12);
    --shadow-lg:0 20px 60px rgba(139,30,63,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--cream);color:var(--navy);font-family:'Tajawal',sans-serif;direction:rtl;line-height:1.7;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  /* ===== Header (shared style) ===== */
  .header{background:var(--white);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);}
  .nav{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .logo{display:flex;align-items:center;gap:14px;}
  .logo-icon{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--burgundy),var(--burgundy-light));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);flex-shrink:0;}
  .logo-icon svg{width:30px;height:30px;color:var(--cream);}
  .logo-text h1{font-size:20px;font-weight:900;color:var(--burgundy);line-height:1.1;font-family:'Amiri',serif;}
  .logo-text p{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .nav-links{display:flex;gap:6px;align-items:center;}
  .nav-links a{padding:10px 16px;border-radius:8px;font-weight:500;font-size:14.5px;color:var(--navy);transition:.2s;}
  .nav-links a:hover{color:var(--burgundy);background:var(--rose-soft);}
  .donate-btn{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy)!important;padding:11px 22px!important;border-radius:30px!important;font-weight:700!important;box-shadow:0 4px 14px rgba(201,150,46,.35);}
  .menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--burgundy);}

  /* ===== Article hero ===== */
  .article-hero{
    position:relative;color:var(--white);min-height:420px;
    display:flex;align-items:flex-end;
    background:linear-gradient(180deg,rgba(139,30,63,.4) 0%,rgba(31,41,55,.92) 100%),var(--burgundy-dark);
    background-size:cover;background-position:center;
    padding:120px 24px 60px;
  }
  .article-hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(139,30,63,.35) 0%,rgba(31,41,55,.92) 100%);
    pointer-events:none;
  }
  .article-hero-inner{max-width:920px;margin:0 auto;width:100%;position:relative;z-index:2;}
  .breadcrumbs{display:flex;gap:10px;align-items:center;font-size:13.5px;margin-bottom:18px;opacity:.9;flex-wrap:wrap;}
  .breadcrumbs a{color:var(--gold-light);transition:.2s;}
  .breadcrumbs a:hover{color:var(--white);}
  .breadcrumbs .sep{opacity:.6;}
  .breadcrumbs .current{color:rgba(255,255,255,.7);}
  .article-cat{
    display:inline-block;background:var(--gold);color:var(--navy);
    padding:6px 16px;border-radius:30px;font-size:12.5px;font-weight:700;
    margin-bottom:18px;letter-spacing:.5px;
  }
  .article-title{
    font-family:'Amiri',serif;
    font-size:42px;font-weight:700;line-height:1.3;
    margin-bottom:22px;text-shadow:0 4px 20px rgba(0,0,0,.3);
  }
  .article-meta{
    display:flex;gap:22px;flex-wrap:wrap;font-size:14px;
    padding-top:18px;border-top:1px solid rgba(255,255,255,.18);
  }
  .article-meta span{display:inline-flex;align-items:center;gap:7px;opacity:.9;}
  .article-meta svg{width:16px;height:16px;}

  /* ===== Article body ===== */
  .article-wrap{max-width:920px;margin:-50px auto 60px;padding:0 24px;position:relative;z-index:5;}
  .article-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;}
  .article-image{
    width:100%;aspect-ratio:16/9;
    background:linear-gradient(135deg,var(--rose),var(--burgundy-light)) center/cover;
  }
  .article-body{padding:48px 50px;}
  .article-excerpt{
    font-size:18px;color:var(--burgundy);line-height:1.9;font-weight:500;
    padding:18px 22px;background:var(--rose-soft);border-radius:12px;
    border-right:4px solid var(--burgundy);margin-bottom:30px;
  }
  .article-content{font-size:16.5px;color:var(--navy);line-height:2.05;white-space:pre-wrap;}
  .article-content p{margin-bottom:16px;}

  /* ===== Share bar ===== */
  .share-bar{
    margin-top:40px;padding-top:28px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  }
  .share-bar .label{font-size:14px;color:var(--slate);font-weight:600;}
  .share-buttons{display:flex;gap:10px;}
  .share-btn{
    width:42px;height:42px;border-radius:50%;
    background:var(--cream);color:var(--burgundy);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;
  }
  .share-btn:hover{background:var(--burgundy);color:var(--white);transform:translateY(-3px);border-color:var(--burgundy);}
  .share-btn svg{width:18px;height:18px;}
  .copy-msg{font-size:13px;color:var(--green,#10b981);display:none;}
  .copy-msg.show{display:inline;}

  /* ===== Related news ===== */
  .related{padding:60px 24px 80px;background:var(--cream-warm);}
  .related-inner{max-width:1240px;margin:0 auto;}
  .related-head{text-align:center;margin-bottom:40px;}
  .related-tag{
    display:inline-block;color:var(--burgundy);font-size:13px;
    font-weight:700;letter-spacing:2px;text-transform:uppercase;
    margin-bottom:8px;
  }
  .related-tag::before, .related-tag::after{
    content:'';display:inline-block;width:30px;height:1px;
    background:var(--burgundy);vertical-align:middle;margin:0 10px;
  }
  .related-title{font-family:'Amiri',serif;font-size:32px;color:var(--navy);}

  .related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
  .news-card{
    background:var(--white);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-sm);transition:.3s;
    border:1px solid var(--line);
    display:flex;flex-direction:column;cursor:pointer;
  }
  .news-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);}
  .news-image{
    height:200px;
    background:linear-gradient(135deg,var(--rose),var(--burgundy-light));
    background-size:cover;background-position:center;position:relative;
  }
  .news-cat{
    position:absolute;top:14px;right:14px;
    background:var(--burgundy);color:var(--white);
    padding:5px 14px;border-radius:30px;font-size:12px;font-weight:600;
  }
  .news-body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column;}
  .news-meta{color:var(--muted);font-size:12.5px;margin-bottom:10px;}
  .news-card h3{font-size:17px;color:var(--navy);margin-bottom:10px;font-weight:700;line-height:1.5;}
  .news-card p{color:var(--slate);font-size:14px;line-height:1.7;flex:1;}
  .news-link{display:inline-flex;align-items:center;gap:6px;color:var(--burgundy);font-weight:700;font-size:14px;margin-top:14px;}

  /* ===== Back btn ===== */
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--white);color:var(--burgundy);
    border:1px solid var(--line);padding:10px 20px;border-radius:30px;
    font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;transition:.2s;text-decoration:none;
    box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{background:var(--burgundy);color:var(--white);border-color:var(--burgundy);transform:translateX(4px);}

  /* ===== Loading / empty ===== */
  .loader{
    text-align:center;padding:120px 24px;color:var(--muted);
  }
  .spin{
    width:50px;height:50px;border:4px solid var(--line);border-top-color:var(--burgundy);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .not-found{
    text-align:center;padding:120px 24px;
  }
  .not-found .ico{font-size:80px;margin-bottom:20px;}
  .not-found h2{font-family:'Amiri',serif;font-size:32px;color:var(--burgundy);margin-bottom:12px;}
  .not-found p{color:var(--slate);font-size:16px;margin-bottom:28px;max-width:500px;margin-inline:auto;}

  /* ===== Footer ===== */
  footer{background:var(--navy);color:#cbd5e1;padding:50px 24px 22px;}
  footer .inner{max-width:1240px;margin:0 auto;text-align:center;}
  footer .links{display:flex;gap:24px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  footer .links a{color:#94a3b8;font-size:14px;transition:.2s;}
  footer .links a:hover{color:var(--gold-light);}
  footer .copy{font-size:13px;color:#94a3b8;border-top:1px solid #334155;padding-top:18px;}

  @media(max-width:900px){
    .nav-links{display:none;position:absolute;top:100%;right:0;left:0;background:var(--white);flex-direction:column;padding:14px;border-top:1px solid var(--line);box-shadow:var(--shadow-md);}
    .nav-links.open{display:flex;}
    .nav-links a{width:100%;padding:12px 16px;}
    .menu-toggle{display:block;}
    .article-title{font-size:30px;}
    .article-body{padding:32px 24px;}
    .related-grid{grid-template-columns:1fr;}
    .article-hero{padding:90px 18px 50px;min-height:340px;}
  }
  @media(max-width:520px){
    .article-title{font-size:24px;}
    .article-body{padding:26px 20px;}
    .article-excerpt{font-size:16px;padding:14px 16px;}
    .article-content{font-size:15px;}
  }
</style>
</head>
<body>

<header class="header">
  <nav class="nav">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="logo-text">
        <h1 id="org-name">جمعية نساء الأمل</h1>
        <p id="org-tagline">دعم النساء والأطفال في مناطق النزاع</p>
      </div>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="index.html#home">الرئيسية</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#programs">برامجنا</a>
      <a href="index.html#news">الأخبار</a>
      <a href="index.html#contact">اتصل بنا</a>
      <a href="index.html#donate" class="donate-btn">💝 تبرّع</a>
    </div>
    <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </nav>
</header>

<main id="main">
  <div class="loader" id="loader">
    <div class="spin"></div>
    جارٍ تحميل الخبر…
  </div>
</main>

<footer>
  <div class="inner">
    <div class="links">
      <a href="index.html#home">الرئيسية</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#news">الأخبار</a>
      <a href="index.html#contact">اتصل بنا</a>
      <a href="admin.html">لوحة التحكم</a>
    </div>
    <div class="copy">© <span id="copyYear">2026</span> <span id="footer-name">جمعية نساء الأمل</span>. جميع الحقوق محفوظة.</div>
  </div>
</footer>

<script src="db.js"></script>
<script>
const params = new URLSearchParams(location.search);
const newsId = parseInt(params.get('id'), 10);
const $ = (id) => document.getElementById(id);

(async function init(){
  try{
    const org = await NisaaDB.getOrg();
    $('org-name').textContent = org.name;
    $('org-tagline').textContent = org.tagline;
    $('footer-name').textContent = org.name;
    $('copyYear').textContent = new Date().getFullYear();

    if(!newsId){ renderNotFound(); return; }
    const item = await NisaaDB.getNews(newsId);
    if(!item){ renderNotFound(); return; }
    if(item.published === 0){ renderNotFound('هذا الخبر غير متاح حالياً.'); return; }

    document.title = `${item.title} — ${org.name}`;
    renderArticle(item, org);
    const related = await NisaaDB.getRelatedNews(newsId, 3);
    if(related.length) renderRelated(related);
  }catch(err){
    console.error(err);
    renderNotFound('حدث خطأ أثناء تحميل الخبر.');
  }
})();

function renderArticle(n, org){
  const main = $('main');
  const img = n.image ? `style="background-image:url('${NisaaDB.escapeAttr(n.image)}')"` : '';
  const heroImg = n.image ? `background:linear-gradient(180deg,rgba(139,30,63,.4) 0%,rgba(31,41,55,.92) 100%),url('${NisaaDB.escapeAttr(n.image)}') center/cover;` : '';

  main.innerHTML = `
    <section class="article-hero" style="${heroImg}">
      <div class="article-hero-inner">
        <div class="breadcrumbs">
          <a href="index.html">الرئيسية</a>
          <span class="sep">›</span>
          <a href="index.html#news">الأخبار والأنشطة</a>
          <span class="sep">›</span>
          <span class="current">${NisaaDB.escapeHtml(n.title)}</span>
        </div>
        <span class="article-cat">${NisaaDB.escapeHtml(n.category||'خبر')}</span>
        <h1 class="article-title">${NisaaDB.escapeHtml(n.title)}</h1>
        <div class="article-meta">
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${NisaaDB.formatDate(n.date)}</span>
          ${n.author ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${NisaaDB.escapeHtml(n.author)}</span>` : ''}
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>${NisaaDB.escapeHtml(n.category||'')}</span>
        </div>
      </div>
    </section>

    <div class="article-wrap">
      <div class="article-card">
        ${n.image ? `<div class="article-image" ${img}></div>` : ''}
        <div class="article-body">
          ${n.excerpt ? `<div class="article-excerpt">${NisaaDB.escapeHtml(n.excerpt)}</div>` : ''}
          <div class="article-content">${NisaaDB.escapeHtml(n.content || '').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')}</div>

          <div class="share-bar">
            <span class="label">📤 شارك الخبر:</span>
            <div class="share-buttons">
              <a class="share-btn" target="_blank" rel="noopener" id="sh-fb" title="فيسبوك">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
              </a>
              <a class="share-btn" target="_blank" rel="noopener" id="sh-tw" title="تويتر">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/></svg>
              </a>
              <a class="share-btn" target="_blank" rel="noopener" id="sh-wa" title="واتساب">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1l-1 1.2c-.2.2-.4.2-.6.1-.7-.4-1.5-.7-2.6-1.7-.8-.7-1.3-1.6-1.5-1.9-.1-.2 0-.4.1-.5.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5 0-.1-.7-1.5-.9-2.1-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1 2.9 1.2 3.1c.1.2 2 3.2 5 4.5 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3M12 22.1h0c-1.7 0-3.4-.5-4.9-1.3L2 22l1.3-4.9C2.4 15.5 2 13.8 2 12.1 2 6.6 6.5 2.1 12 2.1S22 6.6 22 12.1 17.5 22.1 12 22.1z"/></svg>
              </a>
              <button class="share-btn" id="sh-copy" title="نسخ الرابط">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
              <span class="copy-msg" id="copyMsg">✓ تم النسخ</span>
            </div>
          </div>

          <div style="margin-top:30px;">
            <a href="index.html#news" class="back-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              العودة إلى جميع الأخبار
            </a>
          </div>
        </div>
      </div>
    </div>
  `;

  const url = encodeURIComponent(location.href);
  const text = encodeURIComponent(n.title);
  $('sh-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
  $('sh-tw').href = `https://twitter.com/intent/tweet?url=${url}&text=${text}`;
  $('sh-wa').href = `https://wa.me/?text=${text}%20${url}`;
  $('sh-copy').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(location.href);
      const m = $('copyMsg'); m.classList.add('show');
      setTimeout(() => m.classList.remove('show'), 2000);
    }catch{}
  });
}

function renderRelated(items){
  const html = `
    <section class="related">
      <div class="related-inner">
        <div class="related-head">
          <span class="related-tag">اقرئي أيضاً</span>
          <h2 class="related-title">أخبار ذات صلة</h2>
        </div>
        <div class="related-grid">
          ${items.map(n => `
            <article class="news-card" onclick="location.href='news.html?id=${n.id}'">
              <div class="news-image" ${n.image?`style="background-image:url('${NisaaDB.escapeAttr(n.image)}')"`:''}>
                <span class="news-cat">${NisaaDB.escapeHtml(n.category||'خبر')}</span>
              </div>
              <div class="news-body">
                <div class="news-meta">📅 ${NisaaDB.formatDate(n.date)}</div>
                <h3>${NisaaDB.escapeHtml(n.title)}</h3>
                <p>${NisaaDB.escapeHtml(n.excerpt||'')}</p>
                <span class="news-link">اقرئي المزيد →</span>
              </div>
            </article>
          `).join('')}
        </div>
      </div>
    </section>
  `;
  $('main').insertAdjacentHTML('beforeend', html);
}

function renderNotFound(msg){
  document.title = 'الخبر غير موجود';
  $('main').innerHTML = `
    <div class="not-found">
      <div class="ico">📭</div>
      <h2>الخبر غير موجود</h2>
      <p>${NisaaDB.escapeHtml(msg || 'عذراً، الخبر الذي تبحثين عنه غير موجود أو تم حذفه.')}</p>
      <a href="index.html#news" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        العودة إلى الأخبار
      </a>
    </div>
  `;
}
</script>
</body>
</html>
