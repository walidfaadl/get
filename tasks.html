<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام المهام — جمعية نساء الأمل</title>
<meta name="description" content="نظام مهام خفيف بين المدير ومدير القسم: عرض المهام، تفاصيلها، وتعقيب مدير القسم.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#8b1e3f;
    --burgundy-dark:#6a1530;
    --burgundy-light:#b54a6a;
    --rose-soft:#fce8eb;
    --cream:#faf5ee;
    --gold:#c9962e;
    --gold-light:#e0b955;
    --navy:#1f2937;
    --slate:#475569;
    --muted:#7a8597;
    --line:#e5d9c8;
    --bg:#f5f1ea;
    --white:#ffffff;
    --green:#10b981;
    --amber:#d97706;
    --red:#dc2626;
    --blue:#2563eb;
    --shadow-sm:0 2px 8px rgba(31,41,55,.06);
    --shadow-md:0 8px 24px rgba(139,30,63,.10);
    --shadow-lg:0 20px 50px rgba(139,30,63,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--navy);
    font-family:'Tajawal',sans-serif;
    direction:rtl;
    line-height:1.7;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Role picker ===== */
  .role-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,var(--burgundy-dark),var(--burgundy),var(--burgundy-light));
    position:relative;overflow:hidden;
  }
  .role-wrap::before,.role-wrap::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.06);}
  .role-wrap::before{width:480px;height:480px;top:-180px;right:-160px;}
  .role-wrap::after{width:560px;height:560px;bottom:-260px;left:-180px;}
  .role-card{
    background:var(--white);border-radius:24px;padding:44px 40px;width:100%;max-width:520px;
    box-shadow:var(--shadow-lg);position:relative;z-index:2;
  }
  .role-logo{
    width:70px;height:70px;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--burgundy),var(--burgundy-light));
  }
  .role-logo svg{width:38px;height:38px;}
  .role-card h1{font-family:'Amiri',serif;font-size:26px;color:var(--burgundy);text-align:center;margin-bottom:6px;}
  .role-card .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:30px;}
  .role-opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .role-opt{
    border:2px solid var(--line);border-radius:16px;padding:24px 16px;text-align:center;background:var(--cream);
    transition:.2s;display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .role-opt:hover{border-color:var(--burgundy);transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .role-opt .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--burgundy);background:var(--rose-soft);}
  .role-opt .ic svg{width:28px;height:28px;}
  .role-opt strong{font-size:17px;color:var(--navy);}
  .role-opt span{font-size:12.5px;color:var(--muted);}
  .role-back{text-align:center;margin-top:24px;}
  .role-back a{color:var(--burgundy);font-size:13px;font-weight:600;}

  /* ===== App shell ===== */
  .app{display:none;max-width:1080px;margin:0 auto;padding:0 20px 60px;}
  .app.show{display:block;}
  .app-head{
    background:linear-gradient(135deg,var(--burgundy),var(--burgundy-light));color:#fff;
    border-radius:0 0 26px 26px;padding:22px 26px;margin:0 -20px 26px;box-shadow:var(--shadow-md);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  }
  .app-head .brand{display:flex;align-items:center;gap:14px;}
  .app-head .brand .logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;}
  .app-head .brand .logo svg{width:26px;height:26px;}
  .app-head h1{font-family:'Amiri',serif;font-size:22px;line-height:1.3;}
  .app-head .brand p{font-size:12.5px;opacity:.85;}
  .app-head .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .role-pill{background:rgba(255,255,255,.18);border-radius:30px;padding:8px 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;}
  .role-pill svg{width:16px;height:16px;}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;transition:.2s;}
  .btn-ghost:hover{background:rgba(255,255,255,.26);}

  /* ===== Stat cards ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);}
  .stat .v{font-size:28px;font-weight:900;line-height:1;}
  .stat .l{font-size:13px;color:var(--muted);margin-top:6px;}
  .stat.all .v{color:var(--burgundy);}
  .stat.new .v{color:var(--blue);}
  .stat.prog .v{color:var(--amber);}
  .stat.done .v{color:var(--green);}
  .stat.fail .v{color:var(--red);}

  /* ===== Toolbar ===== */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:var(--white);border:1px solid var(--line);border-radius:30px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--slate);transition:.15s;}
  .chip:hover{border-color:var(--burgundy-light);}
  .chip.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
  .btn-primary{
    background:linear-gradient(135deg,var(--burgundy),var(--burgundy-light));color:#fff;border:none;
    border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .btn-primary svg{width:17px;height:17px;}

  /* ===== Task list ===== */
  .task-list{display:flex;flex-direction:column;gap:14px;}
  .task{
    background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);
    transition:.18s;border-right:5px solid var(--line);cursor:pointer;
  }
  .task:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .task.p-عالية{border-right-color:var(--red);}
  .task.p-متوسطة{border-right-color:var(--gold);}
  .task.p-منخفضة{border-right-color:var(--green);}
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .task-title{font-size:17px;font-weight:700;color:var(--navy);}
  .task-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px;}
  .task-meta span{display:inline-flex;align-items:center;gap:5px;}
  .task-meta svg{width:14px;height:14px;}
  .task-excerpt{color:var(--slate);font-size:14px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .badge{border-radius:30px;padding:4px 13px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
  .badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
  .s-جديدة{background:#e0edff;color:var(--blue);}
  .s-قيد.التنفيذ,.badge[data-s="قيد التنفيذ"]{background:#fef3e2;color:var(--amber);}
  .s-تمت{background:#dcfce7;color:var(--green);}
  .s-لم.تتم,.badge[data-s="لم تتم"]{background:#fde2e2;color:var(--red);}

  .prio{border-radius:8px;padding:3px 10px;font-size:11.5px;font-weight:700;}
  .prio-عالية{background:#fde2e2;color:var(--red);}
  .prio-متوسطة{background:#fef3e2;color:var(--amber);}
  .prio-منخفضة{background:#dcfce7;color:var(--green);}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--white);border:1px dashed var(--line);border-radius:16px;}
  .empty svg{width:52px;height:52px;color:var(--line);margin-bottom:14px;}
  .empty p{font-size:15px;}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;background:rgba(31,41,55,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:100;overflow-y:auto;backdrop-filter:blur(2px);}
  .overlay.show{display:flex;}
  .modal{background:var(--white);border-radius:20px;width:100%;max-width:620px;box-shadow:var(--shadow-lg);margin:auto;overflow:hidden;}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--cream);}
  .modal-head h2{font-family:'Amiri',serif;font-size:21px;color:var(--burgundy);}
  .modal-close{background:none;border:none;color:var(--muted);font-size:26px;line-height:1;padding:0 4px;}
  .modal-close:hover{color:var(--red);}
  .modal-body{padding:24px;max-height:calc(100vh - 220px);overflow-y:auto;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--cream);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:7px;}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--cream);
    font-family:inherit;font-size:14px;color:var(--navy);transition:.15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--burgundy);background:var(--white);box-shadow:0 0 0 4px var(--rose-soft);}
  .field textarea{resize:vertical;min-height:100px;line-height:1.7;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .btn-cancel{background:var(--white);border:1.5px solid var(--line);color:var(--slate);border-radius:11px;padding:10px 20px;font-size:14px;font-weight:600;}
  .btn-cancel:hover{border-color:var(--slate);}
  .btn-del{background:#fff;border:1.5px solid #f3c6c6;color:var(--red);border-radius:11px;padding:10px 18px;font-size:14px;font-weight:600;margin-left:auto;}
  .btn-del:hover{background:#fde2e2;}

  /* ===== Detail view ===== */
  .detail-block{margin-bottom:22px;}
  .detail-block h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;font-weight:700;}
  .detail-block .txt{font-size:15px;color:var(--navy);white-space:pre-wrap;line-height:1.8;}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;}
  .detail-grid .cell{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .detail-grid .cell .k{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .detail-grid .cell .val{font-size:14px;font-weight:700;color:var(--navy);}
  .reply-box{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .reply-box.answered{background:#f4faf6;border-color:#c9ebd5;}
  .reply-box.answered.neg{background:#fdf3f3;border-color:#f3d0d0;}
  .status-choices{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
  .status-choices label{
    border:1.5px solid var(--line);border-radius:11px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;background:var(--white);color:var(--slate);
  }
  .status-choices input{display:none;}
  .status-choices input:checked + label,.status-choices label.sel{border-color:var(--burgundy);background:var(--burgundy);color:#fff;}
  .reply-meta{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;
    padding:13px 24px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.3s;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  @media(max-width:560px){
    .role-opts{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .app-head h1{font-size:19px;}
  }
</style>
</head>
<body>

<!-- ============ Role Picker ============ -->
<div class="role-wrap" id="roleWrap">
  <div class="role-card">
    <div class="role-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <h1>نظام المهام</h1>
    <p class="sub">اختَر دورك للدخول إلى النظام</p>
    <div class="role-opts">
      <button class="role-opt" onclick="chooseRole('مدير')">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1 3-6z"/></svg></span>
        <strong>المدير</strong>
        <span>إنشاء المهام ومتابعتها</span>
      </button>
      <button class="role-opt" onclick="chooseRole('مدير القسم')">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <strong>مدير القسم</strong>
        <span>تنفيذ المهام والتعقيب عليها</span>
      </button>
    </div>
    <div class="role-back"><a href="index.html">← العودة للموقع</a></div>
  </div>
</div>

<!-- ============ App ============ -->
<div class="app" id="app">
  <div class="app-head">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      <div>
        <h1>نظام المهام</h1>
        <p>جمعية نساء الأمل</p>
      </div>
    </div>
    <div class="who">
      <span class="role-pill" id="rolePill"></span>
      <button class="btn-ghost" onclick="switchRole()">تبديل الدور</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip active" data-f="all">الكل</button>
      <button class="chip" data-f="جديدة">جديدة</button>
      <button class="chip" data-f="قيد التنفيذ">قيد التنفيذ</button>
      <button class="chip" data-f="تمت">تمت</button>
      <button class="chip" data-f="لم تتم">لم تتم</button>
    </div>
    <button class="btn-primary" id="newBtn" onclick="openTaskForm()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      مهمة جديدة
    </button>
  </div>

  <!-- List -->
  <div class="task-list" id="taskList"></div>
</div>

<!-- ============ Task form modal (manager) ============ -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">مهمة جديدة</h2>
      <button class="modal-close" onclick="closeOverlay('formOverlay')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f_id">
      <div class="field">
        <label>عنوان المهمة *</label>
        <input type="text" id="f_title" placeholder="مثال: إعداد تقرير المستفيدين الشهري">
      </div>
      <div class="field">
        <label>تفاصيل المهمة *</label>
        <textarea id="f_details" placeholder="اشرح المطلوب بالتفصيل، والمخرجات المتوقعة..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>القسم / الجهة المكلّفة</label>
          <input type="text" id="f_department" placeholder="مثال: قسم البرامج">
        </div>
        <div class="field">
          <label>الأولوية</label>
          <select id="f_priority">
            <option value="عالية">عالية</option>
            <option value="متوسطة" selected>متوسطة</option>
            <option value="منخفضة">منخفضة</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>تاريخ الاستحقاق</label>
          <input type="date" id="f_dueDate">
        </div>
        <div class="field">
          <label>مكلّف من</label>
          <input type="text" id="f_assignedBy" placeholder="اسم المدير" value="المدير">
        </div>
      </div>
      <div class="field">
        <label>ملاحظة المدير (اختياري)</label>
        <input type="text" id="f_managerNote" placeholder="أي توجيه إضافي لمدير القسم">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-del" id="formDelBtn" onclick="deleteCurrent()" style="display:none;">حذف</button>
      <button class="btn-cancel" onclick="closeOverlay('formOverlay')">إلغاء</button>
      <button class="btn-primary" onclick="saveTaskForm()">حفظ المهمة</button>
    </div>
  </div>
</div>

<!-- ============ Task detail modal ============ -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>تفاصيل المهمة</h2>
      <button class="modal-close" onclick="closeOverlay('detailOverlay')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot" id="detailFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script>
const escapeHtml = NisaaDB.escapeHtml;
const formatDate = NisaaDB.formatDate;
const formatDateTime = NisaaDB.formatDateTime;
const LS_ROLE = 'nisaaAmal_taskRole';

let ROLE = null;          // 'مدير' | 'مدير القسم'
let FILTER = 'all';
let TASKS = [];

/* ---------- Role ---------- */
function chooseRole(role){
  ROLE = role;
  localStorage.setItem(LS_ROLE, role);
  enterApp();
}
function switchRole(){
  localStorage.removeItem(LS_ROLE);
  ROLE = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('roleWrap').style.display = 'flex';
}
async function enterApp(){
  document.getElementById('roleWrap').style.display = 'none';
  document.getElementById('app').classList.add('show');
  const isManager = ROLE === 'مدير';
  const pill = document.getElementById('rolePill');
  pill.innerHTML = (isManager
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1 3-6z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>')
    + escapeHtml(ROLE);
  document.getElementById('newBtn').style.display = isManager ? 'inline-flex' : 'none';
  await NisaaDB.ready();
  await refresh();
}

/* ---------- Data / render ---------- */
async function refresh(){
  TASKS = await NisaaDB.listTasks();
  renderStats();
  renderList();
}

function renderStats(){
  const c = { total:TASKS.length, 'جديدة':0, 'قيد التنفيذ':0, 'تمت':0, 'لم تتم':0 };
  TASKS.forEach(t => { if(c[t.status] != null) c[t.status]++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat all"><div class="v">${c.total}</div><div class="l">إجمالي المهام</div></div>
    <div class="stat new"><div class="v">${c['جديدة']}</div><div class="l">جديدة</div></div>
    <div class="stat prog"><div class="v">${c['قيد التنفيذ']}</div><div class="l">قيد التنفيذ</div></div>
    <div class="stat done"><div class="v">${c['تمت']}</div><div class="l">تمت</div></div>
    <div class="stat fail"><div class="v">${c['لم تتم']}</div><div class="l">لم تتم</div></div>`;
}

function statusBadge(s){
  return `<span class="badge s-${s.replace(/ /g,'.')}" data-s="${escapeHtml(s)}">${escapeHtml(s)}</span>`;
}

function renderList(){
  const list = document.getElementById('taskList');
  const items = FILTER === 'all' ? TASKS : TASKS.filter(t => t.status === FILTER);
  if(!items.length){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <p>${ROLE==='مدير' ? 'لا توجد مهام بعد — أنشئ أول مهمة بالضغط على «مهمة جديدة».' : 'لا توجد مهام في هذا التصنيف.'}</p>
    </div>`;
    return;
  }
  list.innerHTML = items.map(t => {
    const due = t.dueDate ? `<span title="تاريخ الاستحقاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${escapeHtml(formatDate(t.dueDate))}</span>` : '';
    const dept = t.department ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>${escapeHtml(t.department)}</span>` : '';
    return `<div class="task p-${escapeHtml(t.priority)}" onclick="openDetail(${t.id})">
      <div class="task-top">
        <div>
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span class="prio prio-${escapeHtml(t.priority)}">${escapeHtml(t.priority)}</span>
            ${dept}${due}
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${escapeHtml(formatDate(t.createdAt))}</span>
          </div>
        </div>
        ${statusBadge(t.status)}
      </div>
      <div class="task-excerpt">${escapeHtml(t.details)}</div>
    </div>`;
  }).join('');
}

/* ---------- Filters ---------- */
document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  FILTER = chip.dataset.f;
  document.querySelectorAll('#filters .chip').forEach(c => c.classList.toggle('active', c===chip));
  renderList();
});

/* ---------- Manager: form ---------- */
function openTaskForm(id){
  const t = id ? TASKS.find(x => x.id === id) : null;
  document.getElementById('formTitle').textContent = t ? 'تعديل المهمة' : 'مهمة جديدة';
  document.getElementById('f_id').value = t ? t.id : '';
  document.getElementById('f_title').value = t ? t.title : '';
  document.getElementById('f_details').value = t ? t.details : '';
  document.getElementById('f_department').value = t ? (t.department||'') : '';
  document.getElementById('f_priority').value = t ? t.priority : 'متوسطة';
  document.getElementById('f_dueDate').value = t ? (t.dueDate||'') : '';
  document.getElementById('f_assignedBy').value = t ? (t.assignedBy||'المدير') : 'المدير';
  document.getElementById('f_managerNote').value = t ? (t.managerNote||'') : '';
  document.getElementById('formDelBtn').style.display = t ? 'inline-flex' : 'none';
  openOverlay('formOverlay');
}

async function saveTaskForm(){
  const title = document.getElementById('f_title').value.trim();
  const details = document.getElementById('f_details').value.trim();
  if(!title || !details){ toast('الرجاء إدخال العنوان والتفاصيل'); return; }
  const idVal = document.getElementById('f_id').value;
  const item = {
    title, details,
    department: document.getElementById('f_department').value.trim(),
    priority: document.getElementById('f_priority').value,
    dueDate: document.getElementById('f_dueDate').value,
    assignedBy: document.getElementById('f_assignedBy').value.trim() || 'المدير',
    managerNote: document.getElementById('f_managerNote').value.trim()
  };
  if(idVal) item.id = Number(idVal);
  await NisaaDB.saveTask(item);
  closeOverlay('formOverlay');
  toast(idVal ? 'تم تحديث المهمة' : 'تمت إضافة المهمة');
  await refresh();
}

let CURRENT_ID = null;
async function deleteCurrent(){
  const id = Number(document.getElementById('f_id').value);
  if(!id) return;
  if(!confirm('هل تريد حذف هذه المهمة نهائياً؟')) return;
  await NisaaDB.deleteTask(id);
  closeOverlay('formOverlay');
  toast('تم حذف المهمة');
  await refresh();
}

/* ---------- Detail + reply ---------- */
function openDetail(id){
  const t = TASKS.find(x => x.id === id);
  if(!t) return;
  CURRENT_ID = id;
  const isManager = ROLE === 'مدير';
  const answered = t.repliedAt && (t.status === 'تمت' || t.status === 'لم تتم' || t.status === 'قيد التنفيذ');

  const grid = `
    <div class="detail-grid">
      <div class="cell"><div class="k">الحالة</div><div class="val">${statusBadge(t.status)}</div></div>
      <div class="cell"><div class="k">الأولوية</div><div class="val"><span class="prio prio-${escapeHtml(t.priority)}">${escapeHtml(t.priority)}</span></div></div>
      ${t.department ? `<div class="cell"><div class="k">القسم</div><div class="val">${escapeHtml(t.department)}</div></div>` : ''}
      ${t.dueDate ? `<div class="cell"><div class="k">تاريخ الاستحقاق</div><div class="val">${escapeHtml(formatDate(t.dueDate))}</div></div>` : ''}
      <div class="cell"><div class="k">مكلّف من</div><div class="val">${escapeHtml(t.assignedBy||'المدير')}</div></div>
      <div class="cell"><div class="k">تاريخ الإنشاء</div><div class="val">${escapeHtml(formatDate(t.createdAt))}</div></div>
    </div>`;

  const detailsBlock = `
    <div class="detail-block">
      <h3>عنوان المهمة</h3>
      <div class="txt" style="font-size:18px;font-weight:700;">${escapeHtml(t.title)}</div>
    </div>
    <div class="detail-block">
      <h3>تفاصيل المطلوب</h3>
      <div class="txt">${escapeHtml(t.details)}</div>
    </div>
    ${t.managerNote ? `<div class="detail-block"><h3>ملاحظة المدير</h3><div class="txt">${escapeHtml(t.managerNote)}</div></div>` : ''}`;

  // Reply section
  let replyBlock = '';
  if(isManager){
    // Manager just sees the department head's feedback (read-only)
    if(answered){
      const neg = t.status === 'لم تتم';
      replyBlock = `<div class="detail-block"><h3>تعقيب مدير القسم</h3>
        <div class="reply-box answered ${neg?'neg':''}">
          <div style="margin-bottom:8px;">${statusBadge(t.status)}</div>
          <div class="txt">${t.reply ? escapeHtml(t.reply) : '<span style="color:var(--muted)">— بدون ملاحظات —</span>'}</div>
          <div class="reply-meta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${escapeHtml(t.repliedBy||'مدير القسم')} • ${escapeHtml(formatDateTime(t.repliedAt))}</div>
        </div></div>`;
    }else{
      replyBlock = `<div class="detail-block"><h3>تعقيب مدير القسم</h3>
        <div class="reply-box"><div class="txt" style="color:var(--muted)">بانتظار تعقيب مدير القسم على هذه المهمة.</div></div></div>`;
    }
  }else{
    // Department head can reply
    const statuses = ['قيد التنفيذ','تمت','لم تتم'];
    replyBlock = `<div class="detail-block"><h3>تعقيبك على المهمة</h3>
      <div class="reply-box">
        <div class="status-choices" id="statusChoices">
          ${statuses.map(s => `<label class="${t.status===s?'sel':''}" data-s="${escapeHtml(s)}" onclick="selectStatus(this)">${escapeHtml(s)}</label>`).join('')}
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>ملاحظات (اختياري)</label>
          <textarea id="replyText" placeholder="اكتب ملاحظاتك أو سبب عدم الإنجاز أو ما تم إنجازه...">${escapeHtml(t.reply||'')}</textarea>
        </div>
        ${t.repliedAt ? `<div class="reply-meta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>آخر تعقيب: ${escapeHtml(formatDateTime(t.repliedAt))}</div>` : ''}
      </div></div>`;
  }

  document.getElementById('detailBody').innerHTML = grid + detailsBlock + replyBlock;

  // Footer buttons
  let foot = `<button class="btn-cancel" onclick="closeOverlay('detailOverlay')">إغلاق</button>`;
  if(isManager){
    foot = `<button class="btn-del" onclick="deleteFromDetail(${t.id})">حذف</button>
            <button class="btn-cancel" onclick="closeOverlay('detailOverlay')">إغلاق</button>
            <button class="btn-primary" onclick="editFromDetail(${t.id})">تعديل المهمة</button>`;
  }else{
    foot = `<button class="btn-cancel" onclick="closeOverlay('detailOverlay')">إغلاق</button>
            <button class="btn-primary" onclick="submitReply(${t.id})">حفظ التعقيب</button>`;
  }
  document.getElementById('detailFoot').innerHTML = foot;
  document.getElementById('detailBody')._pendingStatus = null;
  openOverlay('detailOverlay');
}

function selectStatus(el){
  document.querySelectorAll('#statusChoices label').forEach(l => l.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('detailBody')._pendingStatus = el.dataset.s;
}

async function submitReply(id){
  const sel = document.querySelector('#statusChoices label.sel');
  if(!sel){ toast('اختر حالة المهمة أولاً (تمت / قيد التنفيذ / لم تتم)'); return; }
  const status = sel.dataset.s;
  const reply = document.getElementById('replyText').value.trim();
  await NisaaDB.replyTask(id, { status, reply, repliedBy:'مدير القسم' });
  closeOverlay('detailOverlay');
  toast('تم حفظ التعقيب');
  await refresh();
}

function editFromDetail(id){ closeOverlay('detailOverlay'); openTaskForm(id); }
async function deleteFromDetail(id){
  if(!confirm('هل تريد حذف هذه المهمة نهائياً؟')) return;
  await NisaaDB.deleteTask(id);
  closeOverlay('detailOverlay');
  toast('تم حذف المهمة');
  await refresh();
}

/* ---------- Helpers ---------- */
function openOverlay(id){ document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); document.body.style.overflow=''; }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) closeOverlay(o.id); }));

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- Boot ---------- */
(function init(){
  const saved = localStorage.getItem(LS_ROLE);
  if(saved === 'مدير' || saved === 'مدير القسم'){ ROLE = saved; enterApp(); }
})();
</script>
</body>
</html>
